<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b10"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>MY HOME</title><style>
:root{color-scheme:dark;--bg:#090b10;--panel:#1b1e26;--panel2:#242833;--text:#f8f9fc;--sub:#a0a6b4;--line:#343944;--blue:#6aa8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#293249 0,transparent 50%),var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}main{max-width:1120px;margin:auto;padding:36px 22px 118px}.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--sub)}h1{font-size:clamp(36px,5vw,54px);letter-spacing:-.045em;margin:8px 0 26px}h2{font-size:25px;letter-spacing:-.025em;margin:0 0 14px}h3{font-size:17px;margin:0 0 8px}.muted{color:var(--sub)}.hero{background:linear-gradient(115deg,#343b4d,#222735 55%,#1a2334);border:1px solid #485061;border-radius:28px;padding:28px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px;min-height:170px}.hero p{color:#c6ccd8;margin:10px 0 0}.hero-icon{font-size:54px;background:#ffffff16;border-radius:24px;padding:18px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.section-heading h2{margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:var(--panel);border:1px solid #30343e;border-radius:23px;padding:20px;margin:0}.tile{min-height:160px;text-align:left;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;transition:transform .15s,background .15s}.tile:active{transform:scale(.98)}.tile:hover{background:var(--panel2)}.tile .tile-icon{font-size:28px;display:grid;place-items:center;width:48px;height:48px;background:#ffffff12;border-radius:15px}.tile strong{font-size:18px;letter-spacing:-.02em}.tile small{font-size:13px;color:var(--sub);display:block;margin-top:5px}.overview{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:13px;margin-bottom:12px}.overview .card{min-height:155px}.overview .big{font-size:29px;font-weight:700;margin:16px 0 5px}.overview p{margin:5px 0;color:var(--sub);font-size:14px}button{cursor:pointer;border:0;border-radius:13px;padding:12px 17px;background:var(--blue);color:#091326;font:inherit;font-weight:650}input,textarea{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:13px;background:#10131b;color:white;border:1px solid #414653;font:inherit}textarea{min-height:100px}form button{margin-top:8px}.entry{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry div{flex:1;overflow-wrap:anywhere}.entry small{display:block;color:var(--sub);margin-top:5px}.entry input[type=checkbox]{accent-color:var(--blue)}.del{background:#4a2830;color:#ffc8d0}.back{background:#2d3545;color:#dce8ff;margin-bottom:20px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#141720eb;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-top:1px solid #ffffff18;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));gap:5px;z-index:10}nav button{flex:1;max-width:150px;background:transparent;color:#adb4c2;padding:9px 2px;font-size:12px;display:flex;flex-direction:column;gap:5px;align-items:center}nav button span{font-size:22px}nav button.active{color:#8dbbff}.hidden{display:none!important}p{line-height:1.5}a{color:#9fc4ff}.form-card{margin-bottom:14px}.quick{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.quick button{background:#ffffff1b;color:#f2f5fb;font-size:13px}.page-header{display:flex;align-items:center;justify-content:space-between}.subline{font-size:14px;color:var(--sub)}
@media(max-width:760px){main{padding:24px 15px 112px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.overview{grid-template-columns:1fr 1fr}.overview .card:first-child{grid-column:span 2}.hero{padding:23px;min-height:155px}.hero-icon{font-size:36px;padding:12px}.tile{min-height:145px;padding:16px}.tile strong{font-size:16px}.card{padding:17px}h1{margin-bottom:20px}nav button{font-size:11px}}
</style><main><div class="eyebrow">MA MAISON · MON ORGANISATION</div><h1>MY HOME <span style="font-size:.65em">⌂</span></h1><div id="home"><div class="hero"><div><div class="eyebrow">TABLEAU DE BORD</div><h2 id="greeting" style="margin:12px 0 0">Bonjour 👋</h2><p>Tout ton quotidien, au même endroit.</p><div class="quick"><button onclick="openPage('courses')">＋ Courses</button><button onclick="openPage('agenda')">＋ Événement</button><button onclick="openPage('notes')">＋ Note</button></div></div><div class="hero-icon">⌂</div></div><div class="section-heading"><h2>Aujourd'hui</h2><span class="subline" id="today"></span></div><div class="overview" id="overview"></div><div class="section-heading"><h2>Mes espaces</h2><span class="subline">Accès rapide</span></div><div class="grid" id="tiles"></div></div><div id="page" class="hidden"><button class="back" onclick="openPage('home')">← Tableau de bord</button><h2 id="title"></h2><div id="content"></div></div></main><nav><button data-nav="home" onclick="openPage('home')"><span>⌂</span>Accueil</button><button data-nav="agenda" onclick="openPage('agenda')"><span>▦</span>Agenda</button><button data-nav="courses" onclick="openPage('courses')"><span>🛒</span>Courses</button><button data-nav="frigo" onclick="openPage('frigo')"><span>▤</span>Frigo</button><button data-nav="notes" onclick="openPage('notes')"><span>▤</span>Notes</button></nav><script>
const names={agenda:'📅 Calendrier',notes:'📝 Notes',courses:'🛒 Courses',frigo:'🥦 Réfrigérateur',youtube:'▶️ YouTube',siri:'🎙️ Siri',settings:'⚙️ Réglages'};let data;try{data=JSON.parse(localStorage.getItem('myhome-v1'))||{}}catch{data={}}for(let k of ['agenda','notes','courses','frigo','youtube'])if(!Array.isArray(data[k]))data[k]=[];const save=()=>localStorage.setItem('myhome-v1',JSON.stringify(data));const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tileIcons={agenda:'▦',notes:'▤',courses:'🛒',frigo:'❄',youtube:'▶',siri:'◉',settings:'⚙'};
function updateHome(){const h=new Date().getHours();document.getElementById('greeting').textContent=(h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir')+' 👋';document.getElementById('today').textContent=new Date().toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'});let upcoming=data.agenda.filter(x=>x.date&&x.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date))[0];let pending=data.courses.filter(x=>!x.done).length;let exp=data.frigo.filter(x=>x.date&&x.date<=new Date(Date.now()+3*86400000).toISOString().slice(0,10)).length;document.getElementById('overview').innerHTML=`<div class="card"><h3>▦ Prochain rendez-vous</h3><div class="big">${upcoming?safe(upcoming.name):'Agenda libre'}</div><p>${upcoming?safe(upcoming.date+(upcoming.time?' · '+upcoming.time:'')):'Aucun événement à venir'}</p></div><div class="card"><h3>🛒 Courses</h3><div class="big">${pending}</div><p>produit(s) à acheter</p></div><div class="card"><h3>❄ Réfrigérateur</h3><div class="big">${data.frigo.length}</div><p>${exp} produit(s) à surveiller</p></div>`;document.getElementById('tiles').innerHTML=Object.entries(names).map(([k,n])=>`<button class="card tile" onclick="openPage('${k}')"><span class="tile-icon">${tileIcons[k]}</span><span><strong>${n.replace(/^[^ ]+ /,'')}</strong><small>${Array.isArray(data[k])?data[k].length+' élément(s)':'Ouvrir'}</small></span></button>`).join('')}
function openPage(k){document.getElementById('home').classList.toggle('hidden',k!=='home');document.getElementById('page').classList.toggle('hidden',k==='home');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===k));if(k==='home'){updateHome();return}document.getElementById('title').textContent=names[k];let c=document.getElementById('content');if(k==='siri'){c.innerHTML='<div class="card"><p>Dans Raccourcis Apple, crée un raccourci avec l’action « Ouvrir les URL ». Utilise l’adresse de ton application suivie de ?page=courses, ?page=frigo ou ?page=notes.</p><p>Dis ensuite « Dis Siri, MY HOME Courses » si ton raccourci porte ce nom.</p><p class="muted">Siri ouvre les pages. La dictée et la synchronisation avec les apps Apple demandent une intégration supplémentaire.</p></div>';return}if(k==='settings'){c.innerHTML='<div class="card"><p>Les données restent dans ce navigateur, sans synchronisation iCloud automatique.</p><button onclick="backup()">Exporter mes données</button> <button onclick="document.getElementById(\'file\').click()">Importer</button><input type="file" id="file" accept=".json" onchange="restore(this)"><button onclick="ics()">Exporter agenda .ics</button></div>';return}let fields={agenda:'<input name="date" type="date" required><input name="time" type="time"><textarea name="extra" placeholder="Détails"></textarea>',notes:'<textarea name="extra" placeholder="Contenu de la note"></textarea>',courses:'<input name="extra" placeholder="Quantité">',frigo:'<input name="extra" placeholder="Quantité"><input name="date" type="date" title="Date de péremption">',youtube:'<input name="extra" type="url" placeholder="Lien YouTube" required>'};c.innerHTML=`<div class="card form-card"><form id="form" onsubmit="add(event,'${k}')"><input name="name" required placeholder="${k==='youtube'?'Titre de la vidéo':'Nom ou titre'}">${fields[k]}<button>+ Ajouter</button></form></div><div class="card" id="list"></div>`;render(k)}function add(e,k){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);x.done=false;data[k].push(x);save();openPage(k)}function del(k,id){data[k]=data[k].filter(x=>x.id!==id);save();render(k)}function toggle(id){let x=data.courses.find(x=>x.id===id);x.done=!x.done;save();render('courses')}function render(k){document.getElementById('list').innerHTML=data[k].length?data[k].map(x=>`<div class="entry">${k==='courses'?`<input style="width:20px" type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}')">`:''}<div><b style="${x.done?'text-decoration:line-through':''}">${safe(x.name)}</b><small>${safe([x.date,x.extra].filter(Boolean).join(' · '))}</small>${k==='youtube'&&/^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(x.extra||'')?`<a target="_blank" rel="noopener" href="${safe(x.extra)}">Ouvrir</a>`:''}</div><button class="del" onclick="del('${k}','${x.id}')">✕</button></div>`).join(''):'<p class="muted">Aucun élément pour le moment.</p>'}function download(n,s,t){let u=URL.createObjectURL(new Blob([s],{type:t})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('my-home.json',JSON.stringify(data,null,2),'application/json')}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!['agenda','notes','courses','frigo','youtube'].every(k=>Array.isArray(d[k])))throw Error();if(confirm('Remplacer tes données actuelles ?')){data=d;save();openPage('settings')}}catch{alert('Sauvegarde invalide')}}function ics(){let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MY HOME//FR'];for(let x of data.agenda){if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date||''))continue;let d=x.date.replace(/-/g,'');out.push('BEGIN:VEVENT','UID:'+x.id+'@myhome','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+d,'SUMMARY:'+x.name.replace(/[\n,;]/g,' '),'END:VEVENT')}out.push('END:VCALENDAR');download('my-home.ics',out.join('\r\n'),'text/calendar')}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});openPage(names[new URLSearchParams(location.search).get('page')]?new URLSearchParams(location.search).get('page'):'home');
</script></html>
